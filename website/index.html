<!doctype html>
<html lang="fr" class="lb-standalone-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#008080">
  <meta name="description" content="La Bidouille OS : rétro-informatique, réparations, consoles, émulation et projets DIY dans une interface inspirée des années 90.">
  <title>LA BIDOUILLE OS</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="retro.css">
</head>
<body class="lb-standalone lb-booting">
  <section id="lb-boot" class="lb-boot" aria-label="Démarrage de La Bidouille OS" aria-live="polite">
    <div class="lb-boot-noise" aria-hidden="true"></div>
    <div class="lb-boot-panel">
      <div class="lb-boot-emblem" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <p class="lb-boot-kicker">ATELIER NUMÉRIQUE · SYSTÈME ARTISANAL</p>
      <h1><span>LA</span> BIDOUILLE</h1>
      <p class="lb-boot-edition">OS — Édition rétro 95</p>
      <div class="lb-boot-rule" aria-hidden="true"></div>
      <p id="lb-boot-status" class="lb-boot-status">Contrôle des composants...</p>
      <div class="lb-boot-progress" role="progressbar" aria-label="Progression du démarrage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <button id="lb-boot-skip" class="lb-boot-skip" type="button">Passer le démarrage</button>
    </div>
    <p class="lb-boot-copyright">La Bidouille OS · Une création originale de l’atelier de Leny</p>
  </section>

  <div id="lb-os" aria-label="Bureau de La Bidouille OS" aria-hidden="true">
    <div id="lb-desktop">
      <div id="lb-desktop-icons" aria-label="Raccourcis du bureau"></div>

      <main id="lb-window-layer" aria-label="Fenêtres ouvertes"></main>

      <div id="lb-start-menu" class="lb-start-menu" hidden></div>

      <div id="lb-context-layer" aria-live="polite"></div>

      <footer id="lb-taskbar" class="lb-taskbar" aria-label="Barre des tâches">
        <button
          id="lb-start-button"
          class="lb-start-button lb-bevel-raised"
          type="button"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="lb-start-menu"
        >
          <span class="lb-start-logo" aria-hidden="true"><span></span><span></span></span>
          <span>Démarrer</span>
        </button>

        <div id="lb-task-buttons" class="lb-task-buttons" aria-label="Fenêtres ouvertes"></div>

        <div id="lb-system-tray" class="lb-system-tray lb-bevel-sunken">
          <button
            id="lb-volume-button"
            class="lb-tray-button"
            type="button"
            aria-label="Couper le son"
            aria-pressed="false"
            title="Volume"
          >
            <span class="lb-volume-icon" aria-hidden="true"></span>
          </button>
          <time id="lb-clock" class="lb-clock" aria-label="Heure locale">--:--</time>
        </div>
      </footer>

      <div id="lb-crt" class="lb-crt" aria-hidden="true"></div>
      <div id="lb-announcer" class="lb-visually-hidden" aria-live="polite" aria-atomic="true"></div>
    </div>
  </div>

  <noscript>
    <div class="lb-noscript">JavaScript doit être activé pour démarrer La Bidouille OS.</div>
  </noscript>

  <script src="contenu.js"></script>
  <script src="app.js"></script>
  <script src="retro.js"></script>
</body>
</html>
